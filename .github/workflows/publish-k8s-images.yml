name: Publish Kubernetes Images

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/publish-k8s-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mahmoudelshazly55/thara-nufa-backend:latest
            ghcr.io/mahmoudelshazly55/thara-nufa-backend:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.k8s
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_SOCKET_URL=
          tags: |
            ghcr.io/mahmoudelshazly55/thara-nufa-frontend:latest
            ghcr.io/mahmoudelshazly55/thara-nufa-frontend:${{ github.sha }}
